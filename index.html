const CAREER_FILL='7,5,9,4,8,6,10,3,9,5,7,6,8,4,10,2'.split(',');
let careerSuit=0;
function careerCard(r){
  const v = r==='A' ? 11 : parseInt(r,10);
  const su=SUITS[careerSuit++%4];
  return {r:r,v:v,s:su.s,c:su.c};
}
/* Sicherheitsnetz: laeuft der Stapel durch sehr schlechtes Spiel doch leer,
   wird deterministisch nachgelegt statt zufaellig gemischt. Die Pruefung zeigt,
   dass perfektes Spiel nie mehr als 15 der mindestens 30 Karten braucht. */
function careerRefill(){
  for(let i=CAREER_FILL.length-1;i>=0;i--)S.shoe.push(careerCard(CAREER_FILL[i]));
}

function careerUnlocked(i){
  if(i===0)return true;
  return !!(S.careerData.done && S.careerData.done[CAREER[i-1].id]);
}

function openCareer(){
  S.gameMode='career';
  hideStartScreen();
  buildCareerSheet();
  openSheet('sheetCareer');
}

function buildCareerSheet(){
  const t=T();
  let h=`<p>${t.careerIntro}</p>`;
  h+=`<div class="coinline"><span class="k">${t.coinsLbl}</span><span class="v">${S.careerData.coins}</span></div>`;
  CAREER.forEach((lv,i)=>{
    const rec=S.careerData.done[lv.id];
    const open=careerUnlocked(i);
    const stars=rec?'\u2605'.repeat(rec.stars)+'\u2606'.repeat(3-rec.stars):'';
    h+=`<button class="lvitem${rec?' done':''}${open?'':' locked'}" ${open?`onclick="careerStart(${i})"`:''}>
          <span class="num">${lv.id}</span>
          <span style="flex:1 1 auto;min-width:0">
            <b>${t.careerNames[i]}</b>
            <span>${open?t.careerHints[i]:t.careerLocked}</span>
            <span style="color:var(--cyan);font-family:'Press Start 2P',monospace;font-size:7px;margin-top:5px">
              $${lv.start} \u2192 $${lv.target} \u00b7 ${lv.rounds.length} ${t.careerRd}</span>
          </span>
          <span class="st">${stars}</span>
        </button>`;
  });
  h+=`<div class="staged">${t.careerStaged}</div>`;
  document.getElementById('cvBody').innerHTML=h;
}

function careerStart(i){
  unlockAudio();
  if(!careerUnlocked(i))return;
  const lv=CAREER[i];
  S.gameMode='career';
  S.career={idx:i,round:0,jokers:2,jokersUsed:0,errors:0,target:lv.target,start:lv.start,running:true};
  S.bank=lv.start;
  closeSheets();hideStartScreen();
  careerRound();
}

function careerRound(){
  const c=S.career,lv=CAREER[c.idx],t=T();
  if(c.round>=lv.rounds.length){careerFinish();return}
  S.shoe=lv.rounds[c.round].split(',').map(careerCard).reverse();
  S.count=0;
  S.dealer=[];S.hole=null;S.holeShown=false;S.hands=[];S.active=0;
  S.pending=null;S.keepCoach=false;S.insuranceBet=0;
  S.bet=lv.bet;S.lastBet=lv.bet;
  S.phase='bet';
  coach('info',t.careerRoundInfo,t.careerRoundBody);
  render();
}

function careerFinish(){
  const c=S.career,lv=CAREER[c.idx],t=T();
  c.running=false;
  /* Zwei Bedingungen. Das Kapital allein reicht nicht: sonst koennte ein
     unkorrigierter Fehler das Level durch Glueck bestehen, und genau das
     schliesst E7 aus. Ein Fehler ohne Joker verliert das Level, unabhaengig
     davon, wie die Karten danach fallen. */
  const clean=c.errors===0;
  const reached=S.bank>=c.target;
  const passed=reached&&clean;
  const stars=passed?Math.max(1,3-c.jokersUsed):0;
  let earned=0;
  if(passed){
    const prev=S.careerData.done[lv.id];
    const full=40+10*lv.id+25*stars;
    earned=prev?Math.round(full*0.25):full;
    S.careerData.coins+=earned;
    if(!prev||stars>prev.stars)S.careerData.done[lv.id]={stars:stars};
    sfx('star');
  }else sfx('lose');

  document.getElementById('ceTitle').textContent=t.careerLvl+' '+lv.id;
  let h=`<div class="endbig" style="color:${passed?'var(--green)':'var(--red)'}">${passed?t.careerPass:t.careerFail}</div>`;
  if(passed)h+=`<div class="endstars">${'\u2605'.repeat(stars)}${'\u2606'.repeat(3-stars)}</div>`;
  h+=`<p>${passed?t.careerPassBody:(clean?t.careerFailBody:t.careerFailDirty)}</p>`;
  h+=`<div class="statgrid" style="margin:12px 0">
        <div class="stat"><div class="k">${t.careerTargetLbl}</div><div class="v" style="color:var(--cyan)">${money(c.target)}</div></div>
        <div class="stat"><div class="k">${t.bank}</div><div class="v" style="color:${passed?'var(--green)':'var(--red)'}">${money(S.bank)}</div></div>
        <div class="stat"><div class="k">${t.careerJok}</div><div class="v">${c.jokers}/2</div></div>
        <div class="stat"><div class="k">${t.uncorrected}</div><div class="v" style="color:${clean?'var(--green)':'var(--red)'}">${c.errors}</div></div>
        <div class="stat"><div class="k">${t.coinsEarned}</div><div class="v" style="color:var(--gold)">+${earned}</div></div>
      </div>`;
  h+=`<div style="display:grid;gap:8px;margin-top:6px">
        <button class="btn sm b-hit" onclick="careerStart(${c.idx})">${t.retry}</button>
        <button class="btn sm b-ghost" onclick="closeSheets();openCareer()">${t.backToList}</button>
      </div>`;
  h+=`<div class="staged">${t.careerStaged}</div>`;
  document.getElementById('ceBody').innerHTML=h;
  openSheet('sheetCareerEnd');
  render();save();
}

/* ---------- Joker ---------- */
function careerUseJoker(){
  const c=S.career,t=T();
  if(S.phase!=='mistake'||!c||c.jokers<=0)return;
  c.jokers--;c.jokersUsed++;
  clearHighlight();closeSheets();
  coach('info',t.jokerUsedMsg,t.jokerUsedBody);
  sfx('star');
  S.phase='player';
  execute(S.pending);
  render();save();
}
function careerAcceptMistake(){
  const t=T();
  if(S.phase!=='mistake')return;
  /* Erst hier wird gezaehlt: ein per Joker geheilter Fehler ist kein
     unkorrigierter Fehler und darf das Level nicht kosten. */
  if(S.career)S.career.errors++;
  clearHighlight();closeSheets();
  coach('bad',t.mistakeKept,t.mistakeKeptBody);
  toast(t.careerFail,t.mistakeKeptToast);
  S.phase='player';
  execute(S.lastChoice);
  render();save();
}

/* ---------- Anzeige ueber dem Tisch ---------- */
function renderCareerBar(){
  const el=document.getElementById('careerBar');
  const on=S.gameMode==='career'&&S.career&&S.career.running;
  el.classList.toggle('hidden',!on);
  if(!on)return;
  const c=S.career,lv=CAREER[c.idx],t=T();
  const pct=Math.max(0,Math.min(100,S.bank/c.target*100));
  const hit=S.bank>=c.target?' hit':'';
  let jok='';
  for(let i=0;i<2;i++)jok+=`<i class="${i<c.jokers?'':'used'}"></i>`;
  el.innerHTML=
    `<div class="cbtop">
       <span class="lv">${t.careerLvl} ${lv.id} \u00b7 ${t.careerNames[c.idx]}</span>
       <span class="rd">${t.careerRd} ${Math.min(c.round+1,lv.rounds.length)}/${lv.rounds.length}</span>
     </div>
     <div class="cbgoal"><span>${money(S.bank)}</span><span>${t.careerTargetLbl} <b>${money(c.target)}</b></span></div>
     <div class="cbbar${hit}"><i style="width:${pct}%"></i></div>
     <div class="cbjok">${jok}<span style="margin-left:4px">${c.jokers} ${t.jokerLeft}</span>
       ${c.errors?`<span style="margin-left:auto;color:var(--red)">${t.uncorrected}: ${c.errors}</span>`:''}</div>`;
}

/* ---------- Coins in Endless einloesen ---------- */
function redeemCoins(){
  const t=T();
  if(S.gameMode!=='endless'){return}
  const c=Math.floor(S.careerData.coins);
  if(c<1){toast(t.coinsLbl,t.redeemNone);return}
  S.bank+=c;S.careerData.coins=0;
  sfx('chip');closeSheets();
  toast(t.coinsLbl,'+'+money(c));
  if(S.phase==='broke')toBetting(); else render();
  save();
}

/* ============================================================================
   15. BOOT
   ========================================================================= */
(async function boot(){
  await load();
  initPWA();
  freshShoe();
  setLang(S.lang);
  toBetting();
  showStartScreen();
  if(!S.seenTut){S.seenTut=true;save()}
})();
</script>
